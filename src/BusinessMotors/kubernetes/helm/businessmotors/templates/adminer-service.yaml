{{- if .Values.adminer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: adminer
  labels:
    {{- include "businessmotors.labels" . | nindent 4 }}
spec:
  type: {{ .Values.adminer.service.type }}
  selector:
    app: adminer
  ports:
    - name: http
      port: {{ .Values.adminer.service.port }}
      targetPort: http
      {{- if and (eq .Values.adminer.service.type "NodePort") .Values.adminer.service.nodePort }}
      nodePort: {{ .Values.adminer.service.nodePort }}
      {{- end }}
{{- end }}