apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: development
type: Opaque
stringData:
  # Default credentials; rotate before production use.
  root-password: secret
  database: businessmotors
  user: businessmotors
  password: secret
  # Full connection string used by the API via the env var ApiSettings__ConnectionStringDB.
  connection-string: "Server=mysql.development.svc.cluster.local;Port=3306;Database=businessmotors;Uid=businessmotors;Pwd=secret"
